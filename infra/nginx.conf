server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  # Mini App static bundle
  location / {
    try_files $uri /index.html;
  }

  # API, Telegram webhook, and short share URLs → bot service
  location /api/ {
    proxy_pass http://bot:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /webhook {
    proxy_pass http://bot:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /s/ {
    proxy_pass http://bot:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
