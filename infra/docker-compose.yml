services:
  bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile.bot
    env_file: ../.env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file: ../.env
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Serves the Mini App bundle and proxies /api, /webhook, /s/* to the bot,
  # so the Cloudflare tunnel needs exactly one origin: this container.
  miniapp:
    build:
      context: ..
      dockerfile: infra/Dockerfile.miniapp
    depends_on:
      - bot
    expose:
      - "80"
    restart: unless-stopped

  # Cloudflare tunnel: blackroom.verxyl.com → miniapp:80 (configured in the
  # Zero Trust dashboard; CLOUDFLARE_TUNNEL_TOKEN comes from there).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    env_file: ../.env
    depends_on:
      - miniapp
    restart: unless-stopped
